server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time (via a variable) means
    # nginx still starts if the backend container isn't up yet, instead of
    # crash-looping with "host not found in upstream".
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
